[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "v18-verify"
version = "1.0.0"
description = "Check V18 age tickets on your website server (Python, uses cryptography)"
readme = "README.md"
requires-python = ">=3.9"
# No licence has been chosen yet (the npm packages say "UNLICENSED"). See LICENSE.
license = "LicenseRef-UNLICENSED"
license-files = ["LICENSE"]
authors = [{ name = "V18" }]
keywords = ["age verification", "privacy", "blind signatures", "rfc9474", "v18"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet :: WWW/HTTP",
    # Stops an accidental upload to PyPI until a licence is chosen.
    "Private :: Do Not Upload",
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools]
packages = ["v18_verify"]
