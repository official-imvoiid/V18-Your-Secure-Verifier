[package]
name = "v18_prover"
version = "0.1.0"
edition = "2021"
publish = false
description = "V18: Anon Aadhaar Groth16 prover for Android (ark-circom witness from the official wasm + ark-groth16 with the official zkey), exposed over a C ABI for Dart FFI."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-circom = { version = "=0.6.0", default-features = false }
ark-bn254 = "0.6.0"
ark-groth16 = { version = "0.6", default-features = false, features = ["parallel"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false }
ark-std = { version = "0.6.0", default-features = false, features = ["parallel", "std"] }
ark-relations = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
ark-snark = { version = "0.6", default-features = false }
num-bigint = "0.4.3"
serde_json = "1.0"
rayon = "1.10"
rand = "0.8"
wasmer = { version = "6.1.0-rc.3", default-features = false, features = ["default"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true
panic = "unwind"
